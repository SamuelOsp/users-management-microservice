services:
  - type: web
    name: users-management-api
    runtime: docker
    plan: free
    # TiDB Cloud (guia 4) esta en AWS N. Virginia (us-east-1): misma zona geografica que el servicio
    region: virginia
    branch: main
    # Despliega solo cuando la CI de GitHub Actions (.github/workflows/ci.yml) termina en verde
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: crud_usuarios
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: VERIFY_IDENTITY
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_ADDRESS
        sync: false
      - key: BREVO_FROM_NAME
        value: Gestion de Usuarios
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_SECONDS
        value: "900"
